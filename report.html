<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garmin Social Report Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans TC',sans-serif;font-size:13px;color:#1a1a1a;background:#F2F2F2}
.hdr{height:48px;background:#000;border-bottom:3px solid #E8001D;display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0}
.hdr-logo{font-size:15px;font-weight:900;color:#fff;letter-spacing:.1em}
.hdr-sep{width:1px;height:18px;background:#333}
.hdr-sub{font-size:11px;color:#666}
.hdr-btns{margin-left:auto;display:flex;gap:8px;align-items:center}
.hbtn{padding:6px 14px;border-radius:3px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid #444;background:transparent;color:#bbb;transition:all .15s}
.hbtn:hover:not(:disabled){border-color:#888;color:#fff}
.hbtn.pri{background:#E8001D;border-color:#E8001D;color:#fff}
.hbtn.pri:hover:not(:disabled){background:#c40018}
.hbtn:disabled{opacity:.3;cursor:not-allowed}
.spin-row{display:none;align-items:center;gap:6px;font-size:11px;color:#888}
.spin-row.show{display:flex}
.spin{width:10px;height:10px;border:2px solid #333;border-top-color:#E8001D;border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.app{display:flex;height:calc(100vh - 48px)}
.sb{width:272px;min-width:240px;background:#fff;border-right:1px solid #E0E0E0;display:flex;flex-direction:column;overflow:hidden}
.sb-top{flex:1;overflow-y:auto}
.sec{padding:12px 14px;border-bottom:1px solid #F0F0F0}
.slbl{font-size:9px;font-weight:700;letter-spacing:.1em;color:#AAA;text-transform:uppercase;margin-bottom:7px}
.drop{border:1.5px dashed #DDD;border-radius:4px;padding:14px 10px;text-align:center;cursor:pointer;background:#FAFAFA;transition:all .18s}
.drop:hover,.drop.drag{border-color:#E8001D;background:#FFF5F5}
.drop.ok{border-color:#16A34A;border-style:solid;background:#F0FDF4}
.drop-ico{font-size:18px;margin-bottom:4px}
.drop-name{font-size:11px;font-weight:600;color:#333;margin-bottom:1px}
.drop-sub{font-size:10px;color:#AAA}
.up-stat{margin-top:6px;font-size:10px;min-height:13px}
.ok-c{color:#16A34A;font-weight:600}
.err-c{color:#E8001D}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.fld label{font-size:9px;color:#AAA;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select,.fld textarea{padding:5px 7px;border:1px solid #E0E0E0;border-radius:3px;font-size:11px;font-family:inherit;color:#222;background:#fff;outline:none;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#000}
.fld textarea{resize:vertical;min-height:78px;line-height:1.6}
.plt-row{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.plt{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;border:1.5px solid #DDD;background:#fff;cursor:pointer;color:#BBB;font-family:inherit;transition:all .15s}
.plt.on-IG{border-color:#E1306C;color:#E1306C;background:#FFF0F5}
.plt.on-FB{border-color:#1877F2;color:#1877F2;background:#F0F5FF}
.plt.on-TH{border-color:#444;color:#333;background:#F5F5F5}
.camp-wrap{display:flex;flex-direction:column;gap:2px;max-height:120px;overflow-y:auto}
.ci{display:flex;align-items:flex-start;gap:6px;font-size:10.5px;cursor:pointer;padding:2px 0;line-height:1.4}
.ci input{accent-color:#000;margin-top:2px;flex-shrink:0}
.smgr{display:flex;flex-direction:column;gap:4px}
.scard{border:1px solid #E0E0E0;border-radius:4px;cursor:pointer;overflow:hidden;transition:all .15s}
.scard:hover{border-color:#999}
.scard.active{border-color:#000;box-shadow:0 0 0 1px #000}
.sc-h{display:flex;align-items:center;padding:6px 8px;gap:6px;background:#FAFAFA}
.sc-n{width:16px;height:16px;background:#E0E0E0;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#666;flex-shrink:0}
.scard.active .sc-n{background:#000;color:#fff}
.sc-lbl{font-size:10px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-del{font-size:14px;color:#CCC;padding:0 2px;line-height:1;cursor:pointer}
.sc-del:hover{background:#EEE;color:#E8001D}
.sc-tags{padding:3px 8px 6px;display:flex;flex-wrap:wrap;gap:3px}
.sc-tag{font-size:8px;padding:1px 5px;border-radius:8px;background:#F0F0F0;color:#777;border:1px solid #E5E5E5}
.sc-type{font-size:7.5px;padding:1px 5px;border-radius:8px;background:#000;color:#fff}
.add-s{width:100%;padding:6px;border:1.5px dashed #DDD;border-radius:4px;background:transparent;font-size:10px;font-weight:700;color:#E8001D;cursor:pointer;font-family:inherit;transition:all .15s}
.add-s:hover:not(:disabled){border-color:#E8001D;background:#FFF5F5}
.add-s:disabled{opacity:.3;cursor:not-allowed}
.cfg{border-top:2px solid #000;padding:12px 14px;flex-shrink:0;background:#fff;display:none;overflow-y:auto;max-height:62vh}
.type-row{display:flex;gap:4px;margin-bottom:9px;flex-wrap:wrap}
.tbtn{padding:5px 8px;border:1px solid #DDD;border-radius:3px;font-size:9.5px;font-weight:700;cursor:pointer;font-family:inherit;background:#fff;color:#AAA;transition:all .15s;white-space:nowrap}
.tbtn.on{background:#000;color:#fff;border-color:#000}
.ai-btn{width:100%;padding:7px;background:#1A56DB;color:#fff;border:none;border-radius:3px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:5px;transition:background .15s}
.ai-btn:hover:not(:disabled){background:#1447C0}
.ai-btn:disabled{opacity:.4;cursor:not-allowed}
.ai-copied{display:none;font-size:10px;color:#16A34A;font-weight:600;text-align:center;margin-bottom:5px;padding:4px 8px;background:#F0FDF4;border-radius:3px;border:1px solid #BBF7D0}
.ai-copied.show{display:block}
.apply-btn{width:100%;padding:8px;background:#000;color:#fff;border:none;border-radius:3px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;transition:background .15s}
.apply-btn:hover{background:#333}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.mbar{height:34px;background:#fff;border-bottom:1px solid #E5E5E5;display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0}
.mbar-t{font-size:10px;color:#888;flex:1}
.stp{background:#F0F0F0;border:1px solid #E5E5E5;border-radius:20px;padding:2px 9px;font-size:9.5px;color:#666;display:none}
.stp b{color:#222;font-weight:700}
.cv-area{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:#CCC;text-align:center}
.slide-lbl{font-size:8.5px;font-weight:700;color:#AAA;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.cv-wrap{border:1px solid #CCC;border-radius:3px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.12)}
.cv-wrap canvas{display:block;width:100%}
.save-btn{padding:5px 13px;border-radius:3px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid #16A34A;background:transparent;color:#16A34A;transition:all .15s}
.save-btn:hover:not(:disabled){background:#16A34A;color:#fff}
.save-btn:disabled{opacity:.3;cursor:not-allowed}
.save-ok{font-size:10px;color:#16A34A;font-weight:600;display:none;margin-left:6px}
.save-ok.show{display:inline}
</style>
</head>
<body>
<div class="hdr">
  <span class="hdr-logo">GARMIN.</span>
  <div class="hdr-sep"></div>
  <span class="hdr-sub">Social Report Builder</span>
  <div class="hdr-btns">
    <div class="spin-row" id="hdr-spin"><div class="spin"></div><span id="spin-txt">處理中</span></div>
    <button class="hbtn" id="btn-preview" disabled>重新產生預覽</button>
    <button class="save-btn" id="btn-save" disabled>↑ 存入 Sheets</button>
    <span class="save-ok" id="save-ok">✓ 已儲存</span>
    <button class="hbtn pri" id="btn-export" disabled>↓ 下載 PPTX</button>
  </div>
</div>
<div class="app">
  <div class="sb">
    <div class="sb-top">
      <div class="sec">
        <div class="slbl">資料來源</div>
        <div class="drop" id="drop-zone">
          <div class="drop-ico">📁</div>
          <div class="drop-name">上傳 Sprinklr CSV</div>
          <div class="drop-sub">可同時選取多個 .csv 檔案（IG + FB）</div>
        </div>
        <input type="file" id="file-input" accept=".csv" multiple style="display:none">
        <div class="up-stat" id="up-stat"></div>
      </div>
      <div class="sec">
        <div class="slbl">預設時間區間</div>
        <div class="row2">
          <div class="fld"><label>開始</label><input type="date" id="g-d0"></div>
          <div class="fld"><label>結束</label><input type="date" id="g-d1"></div>
        </div>
      </div>
      <div class="sec">
        <div class="slbl">Slide 管理</div>
        <div class="smgr" id="smgr"></div>
        <div style="height:5px"></div>
        <button class="add-s" id="add-s" disabled>＋ 新增 Slide</button>
      </div>
    </div>
    <div class="cfg" id="cfg">
      <div class="slbl" style="margin-bottom:8px">Slide <span id="cfg-num">1</span> 設定</div>
      <div class="fld"><label>名稱</label><input type="text" id="cfg-name" placeholder="例：Pokemon Campaign"></div>
      <div class="row2">
        <div class="fld"><label>開始</label><input type="date" id="cfg-d0"></div>
        <div class="fld"><label>結束</label><input type="date" id="cfg-d1"></div>
      </div>
      <div class="slbl" style="margin-bottom:4px">平台</div>
      <div class="plt-row" id="cfg-plats">
        <button class="plt on-IG" data-p="IG">IG</button>
        <button class="plt on-FB" data-p="FB">FB</button>
        <button class="plt on-TH" data-p="TH">Threads</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div class="slbl" style="margin:0">Campaign 篩選</div>
        <button id="tog-all" style="font-size:9px;color:#E8001D;cursor:pointer;background:none;border:none;font-family:inherit;font-weight:600">全選／全消</button>
      </div>
      <div class="camp-wrap" id="cfg-camps"></div>
      <div class="slbl" style="margin-top:9px;margin-bottom:4px">版面類型</div>
      <div class="type-row">
        <button class="tbtn on" id="t-rc">Monthly Recap</button>
        <button class="tbtn" id="t-kpi">KPI Summary</button>
        <button class="tbtn" id="t-tl">Content Timeline</button>
        <button class="tbtn" id="t-hi">Campaign Highlight</button>
      </div>
      <div class="slbl" style="margin-bottom:4px">觀察摘要</div>
      <button class="ai-btn" id="ai-btn" disabled>📋 複製 AI 分析提示詞</button>
      <div class="ai-copied" id="ai-copied">✓ 已複製！貼到 Claude 對話框取得分析</div>
      <div class="fld" style="margin-bottom:0">
        <textarea id="insight-txt" placeholder="貼入 AI 分析結果，或手動填寫觀察與建議..."></textarea>
      </div>
      <button class="apply-btn" id="apply-btn">套用並更新預覽</button>
    </div>
  </div>
  <div class="main">
    <div class="mbar">
      <div class="mbar-t" id="mbar-t">上傳 CSV 後，點「新增 Slide」開始建立報告</div>
      <div class="stp" id="stp-p">貼文 <b id="c-p">0</b></div>
      <div class="stp" id="stp-r">觸及 <b id="c-r">-</b></div>
      <div class="stp" id="stp-e">互動 <b id="c-e">-</b></div>
    </div>
    <div class="cv-area" id="cv-area">
      <div class="empty" id="empty">
        <div style="font-size:32px;opacity:.15;font-weight:900;letter-spacing:.05em">GARMIN.</div>
        <div style="font-size:11px;line-height:2.2;color:#BBB">1. 上傳 Sprinklr CSV<br>2. 點「新增 Slide」選擇版型<br>3. 套用並更新預覽，下載 PPTX</div>
      </div>
      <div id="slides-area"></div>
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded',function(){

// ============================================================
// 尺寸：13.3333" × 7.5"（從原始 PPTX 解析）
// Canvas display: 960 × 540
// ============================================================
var PW=13.3333, PH=7.5;
var CW=960, CH=540;
function px(inch){ return Math.round(inch/PW*CW); }
function py(inch){ return Math.round(inch/PH*CH); }
function ps(inch){ return Math.round(inch/PW*CW); } // uniform scale

// ── 顏色（完全對齊原始 PPTX）──
var BLK='#000000', WHT='#FFFFFF';
var RED='#E8001D';        // Garmin 品牌紅
var RED_DARK='#C00000';   // 深紅（標籤背景）
var GREEN='#00B050';      // 成長指標
var GRAY_LT='#E8E8E8';    // lt2（淺灰底）
var GRAY_MID='#888888';   // 中灰
var GRAY_DARK='#444444';  // 深灰文字
var GOLD='#CC9900';       // 第1名
var IG_C='#E1306C', FB_C='#1877F2', TH_C='#444444';

// ── 版型常數（對齊 PPTX 座標）──

// Monthly Recap (Slide 2 照抄)
var RC={
  logoX:0.3602, logoY:0.1836, logoW:0.899,
  titleX:1.3962, titleY:0.3056, titleW:9.6101, titleH:0.6338,
  divY:1.15,
  // KPI table: x=8.4548(但我們要對齊 Slide2 的全幅 KPI 呈現方式)
  kpiTableX:7.50, kpiTableY:0.28, kpiTableW:5.60, kpiTableH:0.72,
  kpiColW:[1.1612,1.4971,2.3976], // from PPTX
  insightX:0.4241, insightY:1.704, insightW:7.0559, insightH:0.934,
  secLblX:0.2609, secLblY:3.5804, secLblW:5.2946, secLblH:0.3501,
  chartX:0.4831, chartY:4.1867, chartW:12.4251, chartH:2.7419,
  // Top3 exact positions from PPTX
  t3:[
    {x:6.055,  y:3.4376, w:1.7228, h:2.5625},
    {x:8.517,  y:3.0742, w:1.6502, h:2.3868},
    {x:10.3535,y:3.3661, w:1.6584, h:2.7054}
  ],
  medals:[
    {x:7.5423, y:3.2323, w:0.3733, h:0.3733, c:GOLD},
    {x:9.9802, y:2.8816, w:0.3733, h:0.3733, c:GRAY_MID},
    {x:11.8248,y:3.2071, w:0.3733, h:0.3733, c:'#A0522D'}
  ]
};

// KPI Summary (Slide 1 照抄 + 延伸)
var KPI={
  titleX:0.50, titleY:0.22, titleH:0.55,
  subtitleY:0.78,
  tableX:0.50, tableY:1.30,
  tableW:12.33, rowH:0.72,
  colW:[2.20,1.80,2.00,2.00,2.20,2.13], // 平台 | Post | Reach | Eng | Eng Rate | vs prev
  headerH:0.38
};

// Content Timeline (延伸設計)
var TL={
  hdrZoneH:1.10,
  iconX:0.28, iconY:0.20, iconR:0.26, iconGap:0.10,
  titleX:1.30, titleY:0.18, titleH:0.50,
  kpiX:9.00, kpiY:0.10, kpiW:4.10, kpiH:0.90,
  kpiColW:[1.10,1.30,1.70],
  tlY:1.22, tlH:0.008,
  bulletX:0.28, bulletW:2.00,
  cardAreaX:2.55, cardGap:0.20,
  cardHdrH:0.26, imgRatio:0.50,
  cardBottomH:2.20
};

// Campaign Highlight (延伸設計)
var HI={
  accentH:0.08,
  titleX:0.50, titleY:0.22,
  campLblX:0.50, campLblY:0.72,
  divY:1.05,
  statCols:[
    {x:0.50,y:1.15,w:2.50},
    {x:3.20,y:1.15,w:2.50},
    {x:5.90,y:1.15,w:2.50},
    {x:8.60,y:1.15,w:2.50}
  ],
  statH:1.20,
  insightX:0.50, insightY:2.55, insightW:5.50, insightH:4.70,
  cardAreaX:6.30, cardAreaY:2.55, cardAreaW:6.80,
  cardGap:0.22, cardH:4.70
};

// ============================================================
var allPosts=[], slides=[], activeId=null, availCamps=[];
var TYPES=['rc','kpi','tl','hi'];
var TYPE_LABELS={'rc':'Monthly Recap','kpi':'KPI Summary','tl':'Content Timeline','hi':'Campaign Highlight'};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function fmt(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n||0);}
function fmtPct(n){return n.toFixed(1)+'%';}
function platOf(t,permalink){
  var u=(t||'').toUpperCase();
  // Account Type 識別
  if(u==='INSTAGRAM'||u.indexOf('INSTAGRAM')>=0)return'IG';
  if(u==='FBPAGE'||u==='FACEBOOK'||u.indexOf('FACEBOOK')>=0)return'FB';
  if(u==='TWITTER'||u.indexOf('TWITTER')>=0)return'TW';
  if(u==='THREAD'||u.indexOf('THREAD')>=0)return'TH';
  // fallback: 從 permalink 判斷
  var p=(permalink||'').toLowerCase();
  if(p.indexOf('instagram.com')>=0)return'IG';
  if(p.indexOf('facebook.com')>=0||p.indexOf('fb.com')>=0)return'FB';
  if(p.indexOf('threads.net')>=0)return'TH';
  return'IG';
}
function cc(c){return(c||'').replace(/ - Asia \(US Marketing\)/g,'').replace(/ - Asia/g,'').trim();}
function fp(sl){
  return allPosts.filter(function(p){
    if(sl.plats.length&&sl.plats.indexOf(p.platKey)<0)return false;
    if(sl.camps.length&&sl.camps.indexOf(p.campaign)<0)return false;
    if(sl.d0&&p.publishedTime.slice(0,10)<sl.d0)return false;
    if(sl.d1&&p.publishedTime.slice(0,10)>sl.d1)return false;
    return true;
  });
}
function showSpin(m){document.getElementById('spin-txt').textContent=m;document.getElementById('hdr-spin').classList.add('show');}
function hideSpin(){document.getElementById('hdr-spin').classList.remove('show');}

// ── CSV Parser ──
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  var idx=0,n=text.length,rows=[];
  function field(){
    if(idx>=n)return'';
    if(text[idx]==='"'){idx++;var v='';while(idx<n){if(text[idx]==='"'){idx++;if(idx<n&&text[idx]==='"'){v+='"';idx++;}else break;}else v+=text[idx++];}return v;}
    var v='';while(idx<n&&text[idx]!==','&&text[idx]!=='\n'&&text[idx]!=='\r')v+=text[idx++];return v.trim();
  }
  function row(){var f=[];while(idx<n){f.push(field());if(idx<n&&text[idx]===',')idx++;else break;}if(idx<n&&text[idx]==='\r')idx++;if(idx<n&&text[idx]==='\n')idx++;return f;}
  var hdrs=row().map(function(h){return h.trim();});
  while(idx<n){if(text[idx]==='\r'||text[idx]==='\n'){idx++;continue;}var cols=row();if(cols.length<3)continue;var obj={};hdrs.forEach(function(h,x){obj[h]=(cols[x]||'').trim();});rows.push(obj);}
  return rows;
}

// ── Upload（支援多檔合併）──
var dz=document.getElementById('drop-zone'),fi=document.getElementById('file-input');
dz.addEventListener('click',function(){fi.click();});
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('drag');});
dz.addEventListener('dragleave',function(){dz.classList.remove('drag');});
dz.addEventListener('drop',function(e){
  e.preventDefault();dz.classList.remove('drag');
  var files=Array.from(e.dataTransfer.files).filter(function(f){return f.name.endsWith('.csv');});
  if(files.length)loadFiles(files);
});
fi.addEventListener('change',function(){
  var files=Array.from(fi.files);
  if(files.length)loadFiles(files);
});

function parseToPost(row){
  var permalink=row['Permalink']||'';
  var accountType=row['Account Type']||'';
  return {
    post:row['Outbound Post']||'',
    account:(row['Account']||'').toLowerCase(),
    platKey:platOf(accountType, permalink),
    campaign:row['Campaign Name']||row['Campaign']||'',
    permalink:permalink,
    publishedTime:row['PublishedTime']||row['ScheduledTime']||'',
    reach:parseInt((row['Post Reach (SUM)']||'0').replace(/,/g,''))||0,
    eng:parseInt((row['Engagements + Clicks (SUM)']||'0').replace(/,/g,''))||0
  };
}

function loadFiles(files){
  var stat=document.getElementById('up-stat');
  stat.textContent='解析中… (0/'+files.length+')';
  var results=[];
  var completed=0;
  var errors=[];

  files.forEach(function(file,idx){
    var r=new FileReader();
    r.onload=function(e){
      try{
        var rows=parseCSV(e.target.result);
        var posts=rows.map(parseToPost).filter(function(p){return p.publishedTime;});
        results.push({name:file.name, posts:posts});
      }catch(err){
        errors.push(file.name+': '+err.message);
      }
      completed++;
      stat.textContent='解析中… ('+completed+'/'+files.length+')';
      if(completed===files.length){
        finalizeLoad(results, errors);
      }
    };
    r.readAsText(file,'UTF-8');
  });
}

function finalizeLoad(results, errors){
  var stat=document.getElementById('up-stat');

  // 合併所有檔案的貼文，用 permalink 去重複
  var seen_perm={};
  var merged=[];
  results.forEach(function(r){
    r.posts.forEach(function(p){
      var key=p.permalink||(p.publishedTime+p.post.slice(0,20));
      if(!seen_perm[key]){seen_perm[key]=1;merged.push(p);}
    });
  });
  // 依發布時間排序
  merged.sort(function(a,b){return a.publishedTime<b.publishedTime?-1:1;});
  allPosts=merged;

  var dates=allPosts.map(function(p){return p.publishedTime.slice(0,10);}).filter(Boolean).sort();
  if(dates.length){
    document.getElementById('g-d0').value=dates[0];
    document.getElementById('g-d1').value=dates[dates.length-1];
  }
  var seen={};availCamps=[];
  allPosts.forEach(function(p){if(p.campaign&&!seen[p.campaign]){seen[p.campaign]=1;availCamps.push(p.campaign);}});
  availCamps.sort();

  // 更新 UI
  var fileNames=results.map(function(r){return r.name.replace('.csv','');}).join(' + ');
  dz.classList.add('ok');
  dz.querySelector('.drop-name').textContent='✓ '+fileNames;
  dz.querySelector('.drop-name').style.color='#16A34A';
  dz.querySelector('.drop-sub').textContent=allPosts.length+' 筆 · '+availCamps.length+' Campaign';

  var errMsg=errors.length?' ⚠ '+errors.length+' 個檔案失敗':'';
  stat.innerHTML='<span class="ok-c">共 '+allPosts.length+' 筆成功合併（'+results.length+' 個檔案）</span>'+errMsg;

  document.getElementById('add-s').disabled=false;
  document.getElementById('btn-preview').disabled=false;
}

// ── Canvas Helpers ──
function wt(ctx,text,x,y,mw,lh,ml){
  if(!text)return 0;
  var chars=Array.from(String(text)),cur='',lines=[];
  for(var ci=0;ci<chars.length&&lines.length<ml;ci++){var test=cur+chars[ci];if(ctx.measureText(test).width>mw&&cur){lines.push(cur);cur=chars[ci];}else cur=test;}
  if(cur&&lines.length<ml)lines.push(cur);
  lines.forEach(function(ln,idx){ctx.fillText(ln,x,y+idx*lh);});
  return lines.length*lh;
}
function F(size){return size+'px "Noto Sans TC",sans-serif';}
function FB(size){return 'bold '+size+'px "Noto Sans TC",sans-serif';}

// ── CANVAS: MONTHLY RECAP (照抄 Slide 2) ──
function drawRC(ctx,s,posts){
  var totR=posts.reduce(function(a,p){return a+p.reach;},0);
  var totE=posts.reduce(function(a,p){return a+p.eng;},0);
  var top3=posts.slice().sort(function(a,b){return b.reach-a.reach;}).slice(0,3);
  var byP={},byD={};
  posts.forEach(function(p){if(!byP[p.platKey])byP[p.platKey]={posts:0,reach:0,eng:0};byP[p.platKey].posts++;byP[p.platKey].reach+=p.reach;byP[p.platKey].eng+=p.eng;});
  posts.forEach(function(p){var d=p.publishedTime.slice(0,10);if(!byD[d])byD[d]={r:0,e:0};byD[d].r+=p.reach;byD[d].e+=p.eng;});
  var dKeys=Object.keys(byD).sort();
  var platC={IG:IG_C,FB:FB_C,TH:TH_C};

  // Garmin logo circle
  var lcx=px(RC.logoX+RC.logoW/2),lcy=py(RC.logoY+RC.logoW/2),lr=px(RC.logoW/2);
  ctx.beginPath();ctx.arc(lcx,lcy,lr,0,Math.PI*2);ctx.fillStyle=WHT;ctx.fill();
  ctx.strokeStyle=BLK;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=BLK;ctx.font=FB(Math.round(lr*0.42));ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('GARMIN',lcx,lcy-lr*0.08);
  ctx.font=F(Math.round(lr*0.28));ctx.fillText('.',lcx+lr*0.42,lcy-lr*0.25);

  // Title
  var mLbl='';
  if(s.d0){try{mLbl=new Date(s.d0+'T00:00:00').toLocaleDateString('zh-TW',{year:'numeric',month:'long'});}catch(e){}}
  var tx=px(RC.titleX),ty=py(RC.titleY);
  ctx.fillStyle=BLK;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font=F(py(0.22));
  ctx.fillText('Monthly Performance Recap – ',tx,ty);
  var w1=ctx.measureText('Monthly Performance Recap – ').width;
  ctx.font=FB(py(0.22));ctx.fillText(mLbl,tx+w1,ty);
  ctx.fillStyle=GRAY_MID;ctx.font=F(py(0.14));
  ctx.fillText('('+s.d0+' ～ '+s.d1+')',tx,ty+py(0.28));

  // Divider line
  ctx.fillStyle=GRAY_LT;ctx.fillRect(px(0.25),py(RC.divY),CW-px(0.50),1);

  // Per-platform KPI table (對齊 PPTX KPI 格式)
  var platKeys=Object.keys(byP);
  var kBlockW=(PW-0.50)/Math.max(platKeys.length,1);
  platKeys.forEach(function(pk,pi){
    var d=byP[pk];var er2=d.reach>0?((d.eng/d.reach)*100).toFixed(1):'0';
    var kx2=px(0.25+pi*kBlockW),ky2=py(RC.divY+0.06),kw2=px(kBlockW)-px(0.08);
    // Platform header bar
    ctx.fillStyle=platC[pk]||GRAY_MID;ctx.fillRect(kx2,ky2,kw2,py(0.28));
    ctx.fillStyle=WHT;ctx.font=FB(py(0.14));ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(pk+' · '+d.posts+' 篇',kx2+8,ky2+py(0.14));
    ctx.textAlign='right';ctx.fillText('互動率 '+er2+'%',kx2+kw2-8,ky2+py(0.14));
    // KPI cells
    var cols2=['Post','Reach/Post','Engagement'];
    var rPerPost=d.posts>0?fmt(Math.round(d.reach/d.posts)):'-';
    var vals2=[String(d.posts),rPerPost,fmt(d.eng)];
    var cellW2=Math.floor(kw2/3);
    cols2.forEach(function(col,ci){
      var cx3=kx2+ci*cellW2,cy3=ky2+py(0.28);
      ctx.fillStyle=ci===0?'#F8F8F8':'#FFFFFF';ctx.fillRect(cx3,cy3,cellW2,py(0.42));
      ctx.strokeStyle=GRAY_LT;ctx.lineWidth=0.5;ctx.strokeRect(cx3,cy3,cellW2,py(0.42));
      ctx.fillStyle=GRAY_MID;ctx.font=F(py(0.12));ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(col,cx3+cellW2/2,cy3+3);
      ctx.fillStyle=BLK;ctx.font=FB(py(0.20));ctx.textBaseline='bottom';ctx.fillText(vals2[ci],cx3+cellW2/2,cy3+py(0.42)-3);
    });
  });

  // Insight bullets
  var ins=s.insight||'';var bl=ins.split('\n').filter(function(l){return l.trim();}).slice(0,4);
  if(bl.length){
    var bx=px(RC.insightX),by=py(RC.insightY);
    ctx.font=F(py(0.16));
    bl.forEach(function(line){
      ctx.fillStyle=BLK;ctx.beginPath();ctx.arc(bx+4,by+py(0.09),py(0.04),0,Math.PI*2);ctx.fill();
      ctx.fillStyle=GRAY_DARK;ctx.textAlign='left';ctx.textBaseline='top';
      wt(ctx,line.replace(/^[●•\-\s]+/,''),bx+12,by,px(RC.insightW)-14,py(0.20),2);
      by+=py(0.24);
    });
  }

  // Section label — black band
  var slx=px(RC.secLblX),sly=py(RC.secLblY),slw=px(RC.secLblW),slh=py(RC.secLblH);
  ctx.fillStyle=BLK;ctx.fillRect(slx,sly,slw,slh);
  ctx.fillStyle=WHT;ctx.font=FB(py(0.16));ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('每日觸及與互動趨勢  &  Top 3 post',slx+px(0.12),sly+slh/2);

  // Chart area
  var chx=px(RC.chartX),chy=py(RC.chartY),chw=px(RC.chartW),chh=py(RC.chartH);
  ctx.fillStyle='#FAFAFA';ctx.fillRect(chx,chy,chw,chh);
  ctx.strokeStyle=GRAY_LT;ctx.lineWidth=0.5;ctx.strokeRect(chx,chy,chw,chh);
  if(dKeys.length){
    var maxR2=Math.max.apply(null,dKeys.map(function(d){return byD[d].r;}))||1;
    var plotH=chh-py(0.28);
    var bw2=Math.max(3,Math.floor((chw-px(0.20))/dKeys.length)-1);
    for(var gi=1;gi<=4;gi++){var gy=chy+Math.round(plotH/4*gi);ctx.strokeStyle='#EEEEEE';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(chx,gy);ctx.lineTo(chx+chw,gy);ctx.stroke();}
    dKeys.forEach(function(d,di){
      var bh3=Math.round((byD[d].r/maxR2)*plotH);
      var bxd=chx+px(0.10)+Math.round(di*(chw-px(0.20))/dKeys.length);
      ctx.fillStyle=RED;ctx.globalAlpha=0.9;ctx.fillRect(bxd,chy+plotH-bh3,Math.max(bw2,2),bh3);ctx.globalAlpha=1;
    });
    ctx.fillStyle=GRAY_MID;ctx.font=F(py(0.10));ctx.textAlign='center';ctx.textBaseline='top';
    var step=Math.ceil(dKeys.length/10);
    dKeys.forEach(function(d,di){if(di%step===0)ctx.fillText(d.slice(5),chx+px(0.10)+Math.round(di*(chw-px(0.20))/dKeys.length)+bw2/2,chy+plotH+2);});
    // legend
    ctx.fillStyle=RED;ctx.fillRect(chx+px(0.10),chy+py(0.04),px(0.10),py(0.07));
    ctx.fillStyle=GRAY_DARK;ctx.font=F(py(0.10));ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('Post Reach',chx+px(0.22),chy+py(0.075));
  }

  // Top 3 post cards (exact PPTX positions)
  var medalC2=[GOLD,'#C0C0C0','#A0522D'];
  top3.slice(0,3).forEach(function(pp,idx){
    var t=RC.t3[idx];var t2=RC.medals[idx];
    var tx2=px(t.x),ty2=py(t.y),tw2=px(t.w),th2=py(t.h);
    var imgH3=Math.round(th2*0.54);
    ctx.fillStyle=WHT;ctx.strokeStyle='#CCCCCC';ctx.lineWidth=0.8;
    ctx.fillRect(tx2,ty2,tw2,th2);ctx.strokeRect(tx2,ty2,tw2,th2);
    ctx.fillStyle=GRAY_LT;ctx.fillRect(tx2,ty2,tw2,imgH3);
    // placeholder image area
    ctx.fillStyle=GRAY_MID;ctx.font=py(0.18)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('📷',tx2+tw2/2,ty2+imgH3/2);
    // Red line
    ctx.fillStyle=RED;ctx.fillRect(tx2,ty2+imgH3,tw2,2);
    var si=ty2+imgH3+2;
    ctx.fillStyle=BLK;ctx.font=FB(py(0.13));ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('Reach  '+fmt(pp.reach),tx2+5,si+py(0.05));
    ctx.fillText('Engagement  '+fmt(pp.eng),tx2+5,si+py(0.20));
    ctx.fillStyle=GRAY_MID;ctx.font=F(py(0.11));
    wt(ctx,cc(pp.campaign).slice(0,22),tx2+4,si+py(0.36),tw2-8,py(0.14),2);
    // Medal circle
    var mx=px(t2.x),my=py(t2.y),mr=px(t2.w/2);
    ctx.fillStyle=medalC2[idx];ctx.beginPath();ctx.arc(mx+mr,my+mr,mr,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=WHT;ctx.font=FB(py(0.16));ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(idx+1),mx+mr,my+mr);
  });
}

// ── CANVAS: KPI SUMMARY (照抄 Slide 1 延伸) ──
function drawKPI(ctx,s,posts){
  var totR=posts.reduce(function(a,p){return a+p.reach;},0);
  var totE=posts.reduce(function(a,p){return a+p.eng;},0);
  var er=totR>0?((totE/totR)*100).toFixed(1):'0';
  var byP={};
  posts.forEach(function(p){if(!byP[p.platKey])byP[p.platKey]={posts:0,reach:0,eng:0};byP[p.platKey].posts++;byP[p.platKey].reach+=p.reach;byP[p.platKey].eng+=p.eng;});

  // Title

  // Table header
  var tx3=px(KPI.tableX),ty3=py(KPI.tableY),tw3=px(KPI.tableW);

  // Data rows

  platKeys.forEach(function(pk,ri){

      cx3+=cw3[ci];
    });

  // Total row
  var tRow=ty3+hh+platKeys.length*rowH;

  ctx.strokeStyle=GRAY_LT;ctx.lineWidth=0.5;ctx.strokeRect(tx3,tRow,tw3,rowH);
  var totalVals=[null,String(posts.length),fmt(totR),fmt(totE),er+'%'];

    cx3+=cw3[ci];
  });

  // Insight
  var ins=s.insight||'';var bl=ins.split('\n').filter(function(l){return l.trim();}).slice(0,5);
  if(bl.length){
    var insY=tRow+rowH+py(0.25);

function drawTL(ctx,s,posts){
  var totR=posts.reduce(function(a,p){return a+p.reach;},0);

  var top3=posts.slice().sort(function(a,b){return b.reach-a.reach;}).slice(0,3);
  var n3=Math.min(top3.length,3);
  var platC={IG:IG_C,FB:FB_C,TH:TH_C};

  // Header zone (white, clean)
  ctx.fillStyle=WHT;ctx.fillRect(0,0,CW,py(TL.hdrZoneH));
  ctx.fillStyle=GRAY_LT;ctx.fillRect(0,py(TL.hdrZoneH),CW,1);

  // Platform icons (circles)
  var ix=px(TL.iconX),iy=py(TL.iconY),ir=px(TL.iconR);
  (s.plats||[]).forEach(function(pl){
    ctx.fillStyle=platC[pl]||GRAY_MID;ctx.beginPath();ctx.arc(ix+ir,iy+ir,ir,0,Math.PI*2);ctx.fill();

// ── CANVAS: CAMPAIGN HIGHLIGHT (延伸設計) ──
function drawHI(ctx,s,posts){
  var totR=posts.reduce(function(a,p){return a+p.reach;},0);
  var totE=posts.reduce(function(a,p){return a+p.eng;},0);
  var er=totR>0?((totE/totR)*100).toFixed(1):'0';
  var top3=posts.slice().sort(function(a,b){return b.reach-a.reach;}).slice(0,3);
  var byCamp={};
  posts.forEach(function(p){var k=cc(p.campaign)||'其他';if(!byCamp[k])byCamp[k]={cnt:0,reach:0,eng:0};byCamp[k].cnt++;byCamp[k].reach+=p.reach;byCamp[k].eng+=p.eng;});
  var topCamp=Object.keys(byCamp).sort(function(a,b){return byCamp[b].reach-byCamp[a].reach;})[0]||'';

  ctx.fillStyle=GRAY_LT;ctx.fillRect(px(0.50),py(HI.divY),CW-px(1.0),1.5);

  // 4 stat cards
  var stats=[
    {label:'總貼文數',val:String(posts.length)+'篇',sub:''},
    {label:'總觸及',val:fmt(totR),sub:''},
    {label:'總互動',val:fmt(totE),sub:''},
    {label:'平均互動率',val:er+'%',sub:''}
  ];
  HI.statCols.forEach(function(col,ci){

    ctx.strokeStyle=GRAY_LT;ctx.lineWidth=0.5;ctx.strokeRect(sx,sy,sw,sh);
    ctx.fillStyle=BLK;ctx.fillRect(sx,sy,sw,3);
    ctx.fillStyle=GRAY_MID;ctx.font=F(py(0.14));ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText(stats[ci].label,sx+10,sy+py(0.14));
    ctx.fillStyle=BLK;ctx.font=FB(py(0.34));ctx.textBaseline='middle';
    ctx.fillText(stats[ci].val,sx+10,sy+py(0.72));
  });

  // Left: insight bullets
  var ins=s.insight||'';var bl=ins.split('\n').filter(function(l){return l.trim();}).slice(0,8);
  if(!bl.length)bl=['共 '+posts.length+' 篇貼文','總觸及 '+fmt(totR),'總互動 '+fmt(totE),'互動率 '+er+'%'];
  var lx2=px(HI.insightX),ly2=py(HI.insightY);
  // Section label
  ctx.fillStyle=BLK;ctx.fillRect(lx2,ly2,3,py(0.24));
  ctx.font=FB(py(0.16));ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('觀察與建議',lx2+8,ly2+py(0.12));
  ly2+=py(0.36);
  ctx.font=F(py(0.15));
  bl.forEach(function(line){

    ctx.fillStyle='#222';ctx.textAlign='left';ctx.textBaseline='top';
    var used=wt(ctx,line.replace(/^[●•\-\s]+/,''),lx2+12,ly2,px(HI.insightW)-14,py(0.20),3);
    ly2+=Math.max(used,py(0.20))+py(0.08);
  });

  // Right: Top 3 cards
  var cw6=px(HI.cardAreaW-(top3.length-1)*HI.cardGap)/Math.max(top3.length,1);
  // fallback: 2 col if only 2 posts
  if(top3.length<3)cw6=(px(HI.cardAreaW)-px(HI.cardGap))/2;

    ctx.strokeStyle='#CCCCCC';ctx.lineWidth=0.8;ctx.strokeRect(cx6,cy6,cw6,ch6);
    ctx.fillStyle=GRAY_LT;ctx.fillRect(cx6,cy6,cw6,imgH6);

    wt(ctx,pp.post.replace(/\n/g,' ').slice(0,100),cx6+px(0.10),si2+py(0.60),cw6-px(0.18),py(0.14),4);
    // ranking badge
    var badgeC=[GOLD,'#C0C0C0','#A0522D'][idx];
    ctx.fillStyle=badgeC;ctx.fillRect(cx6,cy6,px(0.30),py(0.28));
    ctx.fillStyle=WHT;ctx.font=FB(py(0.18));ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(idx+1),cx6+px(0.15),cy6+py(0.14));
  });
}

var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbyDxdq-laqVmyF-4BphzebY5keoSLa81fY0v-J3P1wkOpJVrILWhn-QAAcnWUnoZrD3OA/exec';

document.getElementById('btn-save').addEventListener('click', function() {
  if (!allPosts.length) return;
  var btn = document.getElementById('btn-save');
  var ok = document.getElementById('save-ok');
  btn.disabled = true;
  btn.textContent = '儲存中…';
  ok.classList.remove('show');

  // 整理每個平台的月度數據
  var byP = {};
  allPosts.forEach(function(p) {
    if (!byP[p.platKey]) byP[p.platKey] = {posts:0,reach:0,eng:0,camps:{}};
    byP[p.platKey].posts++;
    byP[p.platKey].reach += p.reach;
    byP[p.platKey].eng += p.eng;
    if (p.campaign) byP[p.platKey].camps[cc(p.campaign)] = 1;
  });

  // 取得時間區間
  var dates = allPosts.map(function(p) { return p.publishedTime.slice(0,10); }).filter(Boolean).sort();
  var dateRange = dates.length ? dates[0] + ' ～ ' + dates[dates.length-1] : '';
  var month = dates.length ? dates[0].slice(0,7) : new Date().toISOString().slice(0,7);

  // 組成要寫入的 rows（每個平台一行）
  var rows = Object.keys(byP).map(function(pk) {
    var d = byP[pk];
    var er = d.reach > 0 ? ((d.eng/d.reach)*100).toFixed(1) : '0';
    var topCamps = Object.keys(d.camps).slice(0,3).join(', ');
    return {
      month: month,
      platform: pk,
      posts: d.posts,
      reach: d.reach,
      engagement: d.eng,
      er: er,
      topCampaign: topCamps,
      dateRange: dateRange
    };
  });

  fetch(SHEETS_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({ action: 'saveReport', rows: rows })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (data.status === 'ok') {
      ok.textContent = '✓ 已存入 Sheets（' + data.added + ' 筆）';
      ok.classList.add('show');
      setTimeout(function() { ok.classList.remove('show'); }, 5000);
    } else {
      alert('儲存失敗：' + JSON.stringify(data));
    }
    btn.textContent = '↑ 存入 Sheets';
    btn.disabled = false;
  })
  .catch(function(err) {
    alert('連線失敗：' + err.message + '\n\n請確認工具已放在 GitHub Pages 上執行。');
    btn.textContent = '↑ 存入 Sheets';
    btn.disabled = false;
  });
});

function pptRC(pres,s,posts){
  var sl=pres.addSlide();sl.background={color:'FFFFFF'};
